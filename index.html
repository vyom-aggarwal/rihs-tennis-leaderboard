<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RIHS Tennis Ladder</title>
    <meta
      name="description"
      content="Live standings for the River Island High School boys and girls tennis ladders."
    />
    <!-- Link previews when the coach texts or emails the team link. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="River Island High School Tennis Ladder" />
    <meta
      property="og:description"
      content="Live Boys and Girls ladder standings, straight from the coach's scores sheet."
    />
    <meta name="theme-color" content="#faf9f7" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d8e34a'/%3E%3Cpath d='M6 6c7 5 7 15 0 20M26 6c-7 5-7 15 0 20' stroke='%23145035' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
    <!-- Warm up the connection to Google before the first CSV request, which shaves a
         round trip off the initial load on mobile networks (PRD 7: under 2s on 4G). -->
    <link rel="preconnect" href="https://docs.google.com" crossorigin />
    <link rel="dns-prefetch" href="https://docs.google.com" />

    <!-- Fraunces (names, headings) and Inter (numbers, body) - the faces the ladder's
         stylesheet is designed around. The stylesheet loads without blocking first paint:
         text shows in the fallback font immediately and swaps when the fonts arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This dashboard needs JavaScript to read the team scores sheet and build the ladder.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
