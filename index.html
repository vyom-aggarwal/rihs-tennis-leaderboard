<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RIHS Tennis Ladder</title>
    <meta
      name="description"
      content="Live standings for the River Island High School boys and girls tennis ladders."
    />
    <meta name="theme-color" content="#145035" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d8e34a'/%3E%3Cpath d='M6 6c7 5 7 15 0 20M26 6c-7 5-7 15 0 20' stroke='%23145035' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
    <!-- Warm up the connection to Google before the first CSV request, which shaves a
         round trip off the initial load on mobile networks (PRD 7: under 2s on 4G). -->
    <link rel="preconnect" href="https://docs.google.com" crossorigin />
    <link rel="dns-prefetch" href="https://docs.google.com" />

    <!-- Display face. `display=swap` means text paints in the fallback immediately and
         never blocks first render, so the 2s budget holds even on a cold cache. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This dashboard needs JavaScript to read the team scores sheet and build the ladder.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
